<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			try {
				document.documentElement.setAttribute('data-theme', localStorage.getItem('raksara-theme') || 'dark');
			} catch {
				document.documentElement.setAttribute('data-theme', 'dark');
			}
		</script>
		<!--
			The WebMCP origin-trial bootstrap is loaded lazily by AgenticTools
			after page load. Chrome requires a third-party trial token to come
			from an external script, but it does not need to block first render.
		-->
		<!-- Accent-aware favicon/PWA links are emitted from +layout.svelte so their
		     version changes whenever the configured accent or logo changes. -->
		<!-- Font preconnect is injected dynamically only when config.font is set (see +layout.svelte) -->
		%sveltekit.head%
		<style>
			/* Keep white CTA text readable across every supported accent palette. */
			.home-btn-primary {
				background:
					linear-gradient(135deg,
						color-mix(in srgb, var(--accent) 92%, white 8%),
						color-mix(in srgb, var(--accent) 68%, #111 32%)) !important;
				border-color: color-mix(in srgb, var(--accent) 82%, white 8%) !important;
				color: #fff !important;
				text-shadow: 0 1px 1px rgb(0 0 0 / 0.2) !important;
				box-shadow:
					inset 0 1px 0 rgb(255 255 255 / 0.32),
					0 8px 24px var(--accent-glow) !important;
			}
			.home-btn-primary:hover {
				background:
					linear-gradient(135deg,
						color-mix(in srgb, var(--accent) 100%, white 0%),
						color-mix(in srgb, var(--accent) 76%, #111 24%)) !important;
				border-color: color-mix(in srgb, var(--accent) 84%, white 16%) !important;
				color: #fff !important;
				box-shadow:
					inset 0 1px 0 rgb(255 255 255 / 0.38),
					0 12px 30px color-mix(in srgb, var(--accent) 22%, transparent) !important;
			}
			.home-btn-primary:active {
				background: color-mix(in srgb, var(--accent) 62%, #111) !important;
				box-shadow: inset 0 2px 5px rgb(0 0 0 / 0.2) !important;
			}

			/* Visible keyboard focus in both light and dark themes. */
			.home-btn:focus-visible,
			.home-section-header a:focus-visible,
			.home-link-item:focus-visible,
			.home-info-card-link:focus-visible {
				outline: 3px solid var(--text-primary);
				outline-offset: 4px;
				box-shadow: 0 0 0 6px var(--bg-base);
			}

			/* Preserve a comfortable touch target for section navigation. */
			.home-section-header a {
				display: inline-flex;
				align-items: center;
				min-height: 44px;
				padding-inline: 0.35rem;
				text-underline-offset: 0.22em;
			}
			.home-section-header a:hover {
				text-decoration: underline;
			}

			@media (forced-colors: active) {
				.home-btn-primary {
					background: ButtonFace !important;
					border: 2px solid ButtonText !important;
					color: ButtonText !important;
				}
				.home-btn:focus-visible,
				.home-section-header a:focus-visible,
				.home-link-item:focus-visible,
				.home-info-card-link:focus-visible {
					outline: 3px solid Highlight;
					box-shadow: none;
				}
			}
		</style>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
